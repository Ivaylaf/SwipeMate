services:
  - type: web
    name: swipemate-api
    runtime: docker
    rootDir: SwipeMate.Api
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Issuer
        value: SwipeMate
      - key: Jwt__Audience
        value: SwipeMate