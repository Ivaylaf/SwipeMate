  <rect x='490' y='270' width='220' height='58' rx='14' ry='14' class='sub'/><text x='600' y='305' text-anchor='middle' class='label'>Controllers и DTO модели</text>
  <rect x='490' y='350' width='220' height='58' rx='14' ry='14' class='sub'/><text x='600' y='385' text-anchor='middle' class='label'>Identity, JWT, бизнес логика</text>
