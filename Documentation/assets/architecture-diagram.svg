  <rect x='100' y='190' width='220' height='58' rx='14' ry='14' class='sub'/><text x='210' y='225' text-anchor='middle' class='label'>.NET MAUI мобилен клиент</text>
  <rect x='100' y='270' width='220' height='58' rx='14' ry='14' class='sub'/><text x='210' y='305' text-anchor='middle' class='label'>XAML страници</text>
  <rect x='100' y='350' width='220' height='58' rx='14' ry='14' class='sub'/><text x='210' y='385' text-anchor='middle' class='label'>ApiClient / Services</text>
