<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='680' viewBox='0 0 1200 680'>
  <style>
    .title { font: 700 28px Arial; fill: #111827; }
    .head { font: 700 20px Arial; fill: #111827; }
    .label { font: 16px Arial; fill: #1f2937; }
    .small { font: 14px Arial; fill: #4b5563; }
    .box1 { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .box2 { fill: #faf5ff; stroke: #a855f7; stroke-width: 3; }
    .box3 { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
